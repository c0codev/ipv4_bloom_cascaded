[package]
name = "ipv4_bloom_cascaded"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = [
    "dep:bloomfilter",
    "dep:cuckoofilter",
    "dep:xorf",
    "dep:fastbloom",
    "dep:rand",
]
baremetal = []

[dependencies]
bloomfilter = { version = "3.0.1", optional = true }
cuckoofilter = { version = "0.5", optional = true }
xorf = { version = "0.13", optional = true }
fastbloom = { version = "0.17", optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "criterion_benchmark"
path = "benches/criterion_benchmark.rs"
harness = false
required-features = ["std"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Uncomment line below if you want to enable debugging
# debug = true
